services:
  redis:
    image: "redis:latest"
    container_name: lcp-redis
    networks:
      - lcp-network

  db:
    build: ./database
    container_name: lcp-postgres
    env_file: .env.docker
    shm_size: 10g
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init-db:/docker-entrypoint-initdb.d
    ports:
      - "15432:5432"
    networks:
      - lcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && [ -f /var/lib/postgresql/data/db.ready ]"]
      interval: 15s
      timeout: 180s
      retries: 10

  worker_internal:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        QUEUE: internal
    container_name: lcp-worker-internal
    environment:
      - IS_DOCKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
      - ./media/:/opt/media/
      - ./uploads:/app/uploads
    networks:
      - lcp-network

  worker_query:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        QUEUE: query
    container_name: lcp-worker-query
    environment:
      - IS_DOCKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
      - ./media/:/opt/media/
      - ./uploads:/app/uploads
    networks:
      - lcp-network

  worker_background:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        QUEUE: background
    container_name: lcp-worker-background
    environment:
      - IS_DOCKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app
      - ./media/:/opt/media/
      - ./uploads:/app/uploads
    networks:
      - lcp-network

  mediasrv:
    image: "nginx:alpine"
    container_name: lcp-mediasrv
    volumes:
      - ./media:/usr/share/nginx/html
    ports:
      - "8090:80"
    networks:
      - lcp-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: lcp-backend
    ports:
      - "9090:9090"
    environment:
      - IS_DOCKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      worker_internal:
        condition: service_started
      worker_query:
        condition: service_started
      worker_background:
        condition: service_started
    volumes:
      - ./:/app
      - ./media/:/opt/media/
      - ./uploads:/app/uploads
    networks:
      - lcp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lcp-frontend
    command: ["yarn", "serve:lcp"]
    depends_on:
      - worker_internal
      - worker_query
      - worker_background
      - backend
    volumes:
      - ./frontend:/app
      - ./media:/app/public/media
    ports:
      - "8080:8080"
    networks:
      - lcp-network

networks:
  lcp-network:
    driver: bridge

volumes:
  db-data:
    driver: local
